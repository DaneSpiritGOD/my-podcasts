name: Refresh feed

on:
  schedule:
    # UTC 20:00 = 04:00 Asia/Shanghai the next day. Scheduled runs are often
    # delayed by GitHub (observed up to ~5h), so keeping the slot at 04:00 means
    # a delay still usually lands before the morning read.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: this workflow holds
      # contents:write, so a retagged or compromised action could push to main.
      # Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version comes from .python-version so CI and a local run cannot drift
      # apart. Deliberately "3.12" rather than a patch version: setup-python then
      # takes the newest 3.12.x, which picks up security fixes on its own. Nothing
      # else updates it — Dependabot manages Actions and pip, not the interpreter.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      # Exit codes are the workflow's whole vocabulary:
      #   0 healthy, 1 needs a human, 2 the run could not start.
      # Never let a non-zero code fail this step: the steps below are what turn
      # it into a visible alarm, and a red run with no issue is a silent alarm.
      - name: Run the pipeline
        id: pipeline
        run: |
          set +e
          python3 src/run.py 2>&1 | tee run-console.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit feed and state
        run: |
          if git diff --quiet -- feed.xml state.json .keepalive; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json .keepalive
          git commit -m "chore: refresh feed"
          git push

      # A durable, human-readable summary on the run page itself, so the state
      # of the last N runs can be read without downloading anything.
      - name: Summarise the run
        if: always()
        run: |
          {
            echo "## Refresh feed"
            echo
            echo '```'
            grep -E '^OUTCOME ' run-console.log || echo "no OUTCOME line: the run did not finish"
            echo '```'
            echo
            echo "Exit code: \`${{ steps.pipeline.outputs.exit_code }}\`"
            echo
            echo "### Last 40 log lines"
            echo '```'
            tail -n 40 run-console.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Exit code 1 means a human is needed: either published Episodes stopped
      # resolving, or the Feed has stopped advancing. Exit code 2 means State
      # could not be read, which also needs a human but is a different problem.
      - name: Raise an issue when the run needs a human
        if: steps.pipeline.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.pipeline.outputs.exit_code }}
        run: |
          # Labels are created on demand: gh issue create fails outright when a
          # label is missing, which would break the only alarm this project has.
          gh label create sentinel --color B60205 \
            --description "Published Episodes are no longer playable" --force
          gh label create stale --color D4C5F9 \
            --description "The Feed has stopped advancing" --force

          # Pick the label from the OUTCOME line rather than from the exit code:
          # both problems exit 1, and the issue title should say which one it is.
          if grep -q 'stale=yes' run-console.log; then
            label=stale
            title="Feed: no new Episode for 14+ days"
            reason="the newest Episode is older than the freshness threshold, so the pipeline has probably stopped producing Episodes even though it keeps reporting success"
          elif [ "$EXIT_CODE" = "2" ]; then
            label=sentinel
            title="Run: state.json could not be read"
            reason="the pipeline refused to run because State could not be parsed, so nothing was published this run"
          else
            label=sentinel
            title="Sentinel: published Episodes are no longer playable"
            reason="the oldest published Episode no longer resolves and could not be recovered from the Article page"
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf '%s\n\n**Outcome**\n\n```\n%s\n```\n\n**Run log:** %s\n' \
            "$reason" \
            "$(grep -E '^OUTCOME ' run-console.log || echo 'no OUTCOME line')" \
            "$run_url")

          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$(printf 'Still true as of %s.\n\n%s' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$body")"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi

      # Make the run itself red as well, so a failed run is visible in the
      # Actions list without opening the issue. Deliberately last: everything
      # above must still happen when this fails.
      - name: Mark the run as failed
        if: steps.pipeline.outputs.exit_code != '0'
        run: |
          echo "::error::The pipeline needs a human (exit ${{ steps.pipeline.outputs.exit_code }}). See the issue and the run log."
          exit 1
